name: release

# Push a tag like v0.2.0 to publish: binaries for Linux and macOS (amd64,
# arm64) with install.sh and checksums on the GitHub release, and a
# multi-arch image at ghcr.io/devai-io/forge.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    # GitHub-hosted runners only: this is a public repository.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test
        run: |
          go vet ./... && go test ./... -count=1
          cd web && npm ci --no-audit --no-fund && npm run typecheck && npm run lint && npm test
      - name: Build archives
        run: make dist VERSION=${GITHUB_REF_NAME}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Forge $GITHUB_REF_NAME" --generate-notes --verify-tag

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/devai-io/forge:${{ github.ref_name }}
            ghcr.io/devai-io/forge:latest
          labels: |
            org.opencontainers.image.source=https://github.com/devai-io/forge
            org.opencontainers.image.licenses=MIT
