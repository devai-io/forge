# Forge in one container; everything it keeps is in the `data` volume
# (the workspace: config.json, forge.db, vault.key, backups/, projects/).
#
#   docker compose up -d
#   docker compose logs forge          # shows the first-run setup link
#   docker compose exec forge forge setup-token   # …or prints it again
#
# The server listens on 127.0.0.1 only. To expose it, put a TLS reverse proxy
# (Caddy, nginx, Traefik…) in front and set PUBLIC_URL to the https address.
services:
  forge:
    image: ghcr.io/devai-io/forge:latest
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      FORGE_TIMEZONE: ${FORGE_TIMEZONE:-UTC}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data

volumes:
  data:
