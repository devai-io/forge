# Forge with its own Postgres. Quick start:
#   cp .env.example .env   # set POSTGRES_PASSWORD (and PUBLIC_URL for a real domain)
#   docker compose up -d
#   docker compose exec forge /forge create-user admin you@example.com
#   open http://localhost:8080
#
# The server listens on 127.0.0.1 only. To expose it, put a TLS reverse proxy
# (Caddy, nginx, Traefik…) in front and set PUBLIC_URL to the https address.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_DB: forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 10

  forge:
    image: ghcr.io/devai-io/forge:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://forge:${POSTGRES_PASSWORD}@db:5432/forge?sslmode=disable
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data

volumes:
  db:
  data:
